<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rush Royale Roguelike</title>
  <meta name="description" content="Tower defense roguelike gratis inspirado en Rush Royale: héroes, mazo de cartas, cofres, jefes, expedición, fusión, supervivencia y desafío diario.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=202610061900">
</head>
<body>
  <div id="menuRoot" class="menu-screen"></div>

  <div id="gameScreen" hidden>
    <div id="hud">
      <div class="hud-item" id="hudMana"><span class="hud-icon">💧</span><span id="manaText">0</span></div>
      <div class="hud-item" id="hudLives"><span class="hud-icon">❤</span><span id="lives">16</span></div>
      <div class="hud-item" id="hudLevel"><span id="hudLabel"></span></div>
      <div class="hud-btns">
        <button class="hud-btn" id="hudAuto" onclick="toggleAutoWave()" title="Olas automáticas">⏩</button>
        <button class="hud-btn" id="hudSound" onclick="toggleSound()" title="Sonido">🔊</button>
        <button class="hud-btn" id="hudPause" onclick="togglePause()" title="Pausa">⏸</button>
      </div>
      <div class="speed-group" id="speedGroup">
        <button class="speed-btn selected" data-speed="1" onclick="setGameSpeed(1)">x1</button>
        <button class="speed-btn" data-speed="2" onclick="setGameSpeed(2)">x2</button>
        <button class="speed-btn" data-speed="4" onclick="setGameSpeed(4)">x4</button>
        <button class="speed-btn" data-speed="8" onclick="setGameSpeed(8)">x8</button>
      </div>
    </div>

    <div id="board-wrap">
      <canvas id="gameCanvas"></canvas>
      <div id="bossBar"><span id="bossName">Jefe</span><div class="bar"><div class="fill" id="bossFill"></div></div></div>
      <div id="bigBanner"><span id="bigBannerText"></span></div>
      <div id="flash"></div>
    </div>

    <div id="controls">
      <div class="mana-bar"><div class="mana-fill" id="manaBar"></div></div>
      <div id="towerRow"></div>
      <div id="actionRow">
        <div id="panelInfo"></div>
        <div class="action-btns">
          <button id="heroBtn" class="hero-btn" onclick="useHero()" aria-label="Habilidad del héroe"><img id="heroImg" alt=""></button>
          <button id="summonBtn" class="btn-summon" onclick="summonTower()" hidden>🎲 Invocar<small><span id="summonCost">20</span> 💧</small></button>
          <button class="btn-start" id="startBtn" onclick="startWave()">Iniciar ola</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>
  <div id="boonOverlay" class="overlay" hidden></div>
  <div id="pauseOverlay" class="overlay" hidden></div>
  <div id="endOverlay" class="overlay" hidden>
    <div class="end-card">
      <h2 id="endTitle">Fin de la partida</h2>
      <div id="endExtra"></div>
      <div id="endDesc"></div>
      <div class="gem-line">💎 +<span id="endGems">0</span> gemas · ⭐ +<span id="endXp">0</span> XP</div>
      <button class="menu-btn menu-btn-primary" id="endAgain">Otra vez</button>
      <button class="menu-btn" onclick="$('endOverlay').hidden = true; go('home')">Menú</button>
    </div>
  </div>
  <div id="chestOverlay" class="overlay chest-overlay" hidden></div>
  <div id="modal" class="overlay" hidden></div>

  <script src="js/core.js?v=202610061900"></script>
  <script src="js/data.js?v=202610061900"></script>
  <script src="js/meta.js?v=202610061900"></script>
  <script src="js/sound.js?v=202610061900"></script>
  <script src="js/grid.js?v=202610061900"></script>
  <script src="js/draw.js?v=202610061900"></script>
  <script src="js/entities.js?v=202610061900"></script>
  <script src="js/game.js?v=202610061900"></script>
  <script src="js/modes.js?v=202610061900"></script>
  <script src="js/menus.js?v=202610061900"></script>
  <script src="js/init.js?v=202610061900"></script>
</body>
</html>
